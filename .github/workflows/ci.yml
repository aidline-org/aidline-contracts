name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: 28.1.0
        run: |
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin stellar
          stellar --version
      - name: Build WASM
        run: stellar contract build

  audit:
    # Fails the build when a dependency has a published security advisory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # RUSTSEC-2026-0387 (crypto-bigint 0.5.5) is reached only through soroban-env-host,
        # the native host used by tests. It is not in the wasm32 contract (checked with
        # `cargo tree --target wasm32v1-none`) and the fix has to come from soroban-sdk.
        # Remove this flag once soroban-sdk moves to crypto-bigint 0.7.6 or later.
        run: cargo audit --ignore RUSTSEC-2026-0387

  fuzz:
    # Run a short bounded fuzz session in CI (Issue #28).
    # The job uses a nightly toolchain and cargo-fuzz.
    # It runs for a maximum of 30 seconds, enough to catch obvious regressions
    # without slowing the pipeline significantly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Use a separate cache key so nightly artifacts don't mix with stable.
          key: fuzz-nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz target (30 s)
        # cargo-fuzz looks for ./fuzz, so it must run from the repository root.
        # -max_total_time limits the wall-clock run; -max_len=4096 keeps
        # inputs small so the fuzzer exercises more paths per second.
        run: |
          cargo fuzz run fuzz_contract -- \
            -max_total_time=30 \
            -max_len=4096
